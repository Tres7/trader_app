name: traderapp

services:
  db:
    image: postgres:16-bookworm
    container_name: traderapp-db
    restart: unless-stopped
    env_file: [../shared/server.env]
    volumes: [traderapp_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: traderapp-rabbitmq
    restart: unless-stopped
    env_file: [../shared/server.env]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    image: ${SERVER_IMAGE}
    container_name: traderapp_server
    restart: unless-stopped
    env_file: [../shared/server.env]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    # `proxy` : reseau externe du Caddy partage du VPS, qui joint ce conteneur par son nom.
    networks: [default, proxy]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  traderapp_db: {}
  rabbitmq_data: {}
  # Plus utilises par ce compose : repris par le Caddy partage (traderapp_caddy_data /
  # traderapp_caddy_config). Declarations gardees jusqu'au renommage des volumes.
  caddy_data: {}
  caddy_config: {}

networks:
  proxy:
    external: true
